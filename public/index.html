<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Chegadas e Saídas - GRU (Real-time)</title>
  <style>
    body { font-family: sans-serif; margin: 0; padding: 0; background-color: #f4f4f4; }
    .top-bar { background-color: #333; color: white; text-align: center; padding: 10px 0; margin-bottom: 15px; }
    .top-bar h1 { margin: 0; font-size: 1.8em; }
    .tab-container { overflow: hidden; border-bottom: 1px solid #ccc; background-color: #fff; margin: 0 10px 10px 10px; }
    .tab-button { background-color: #f1f1f1; float: left; border: none; outline: none; cursor: pointer; padding: 14px 16px; transition: 0.3s; font-size: 17px; }
    .tab-button:hover { background-color: #ddd; }
    .tab-button.active { background-color: #ccc; }
    .tab-content { display: none; padding: 6px 12px; border-top: none; animation: fadeEffect 0.5s; background-color: #fff; margin: 0 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
    @keyframes fadeEffect { from {opacity: 0;} to {opacity: 1;} }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
    th { background-color: #e9e9e9; }
    #loadingIndicator { text-align: center; padding: 20px; font-size: 18px; display: block; margin: 20px; }
    h2 { margin-top: 0; padding-top: 5px; color: #333; }
  </style>
</head>
<body>

  <div class="top-bar">
    <h1>Chegadas e Saídas - Aeroporto de Guarulhos (GRU)</h1>
  </div>

  <div class="tab-container">
    <button class="tab-button active" onclick="openTab(event, 'chegadasTab')">Chegadas</button>
    <button class="tab-button" onclick="openTab(event, 'saidasTab')">Saídas</button>
  </div>

  <div id="loadingIndicator">Carregando dados...</div>

  <div id="chegadasTab" class="tab-content" style="display:block;">
    <h2>Chegadas</h2>
    <table id="chegadasTable">
      <thead>
        <tr><th>Data/Hora Prev</th><th>Voo</th><th>Origem</th><th>Status</th></tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <div id="saidasTab" class="tab-content">
    <h2>Saídas</h2>
    <table id="saidasTable">
      <thead>
        <tr><th>Data/Hora Prev</th><th>Voo</th><th>Destino</th><th>Status</th></tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <script>
    function openTab(evt, tabName) {
      var i, tabcontent, tabbuttons;
      tabcontent = document.getElementsByClassName("tab-content");
      for (i = 0; i < tabcontent.length; i++) {
        tabcontent[i].style.display = "none";
      }
      tabbuttons = document.getElementsByClassName("tab-button");
      for (i = 0; i < tabbuttons.length; i++) {
        tabbuttons[i].className = tabbuttons[i].className.replace(" active", "");
      }
      document.getElementById(tabName).style.display = "block";
      if (evt) evt.currentTarget.className += " active";
    }

    // Initialize SSE and table update logic
    const loadingIndicator = document.getElementById('loadingIndicator');
    const chegadasTbody = document.getElementById('chegadasTable').getElementsByTagName('tbody')[0];
    const saidasTbody = document.getElementById('saidasTable').getElementsByTagName('tbody')[0];

    function updateTable(tbody, items, type) {
        const existingRowIds = new Set();
        for (let row of tbody.rows) {
            if(row.dataset.id) existingRowIds.add(row.dataset.id);
        }
        const currentItemIds = new Set();

        if (!items) return; // Guard against null or undefined items

        items.forEach(item => {
            // Define keys based on type (arrival/departure) for critical fields
            const flightNoKey = 'flight.flightNumber'; // Primary key for flight number
            const flightIcaoKey = 'flight.icao';       // Fallback ICAO for flight number

            const timeScheduledKey = type === 'arrival' ? 'arrival.scheduledTime' : 'departure.scheduledTime';
            const timeEstimatedKey = type === 'arrival' ? 'arrival.estimatedTime' : 'departure.estimatedTime';

            const locationNameKey = type === 'arrival' ? 'arrival.origin.name' : 'departure.destination.name';
            const locationIcaoKey = type === 'arrival' ? 'arrival.origin.icao' : 'departure.destination.icao';

            const statusKey = type === 'arrival' ? 'arrival.status.name' : 'departure.status.name';

            // Construct rowId
            const flightNo = item[flightNoKey] || item[flightIcaoKey] || 'N/A_Flight';
            const time = item[timeEstimatedKey] || item[timeScheduledKey] || String(Date.now()); // Fallback to current time for uniqueness if time is missing
            const rowId = flightNo + '_' + (item[timeScheduledKey] || String(Date.now())); // Use scheduled time for a more stable ID if possible

            currentItemIds.add(rowId);

            let row = tbody.querySelector(`[data-id="${rowId}"]`);
            if (!row) { // Row doesn't exist, insert new
                row = tbody.insertRow();
                row.dataset.id = rowId;
            }
            row.innerHTML = ''; // Clear existing cells to repopulate

            const displayTime = item[timeEstimatedKey] || item[timeScheduledKey] || 'N/A';
            const displayLocation = item[locationNameKey] || item[locationIcaoKey] || 'N/A';
            const displayStatus = item[statusKey] || 'N/A';

            row.insertCell().textContent = displayTime;
            row.insertCell().textContent = flightNo;
            row.insertCell().textContent = displayLocation;
            row.insertCell().textContent = displayStatus;
        });

        // Remove old rows not in current data
        existingRowIds.forEach(id => {
            if (!currentItemIds.has(id)) {
                const rowToRemove = tbody.querySelector(`[data-id="${id}"]`);
                if (rowToRemove) tbody.removeChild(rowToRemove);
            }
        });
    }

    const evtSource = new EventSource('/api/data-stream');

    evtSource.onmessage = function(event) {
      let eventData;
      try {
        eventData = JSON.parse(event.data);
      } catch (err) {
        console.error('Error parsing SSE data:', err, 'Raw data:', event.data);
        // Optionally, display a user-friendly error message on the page
        // e.g., loadingIndicator.textContent = 'Error receiving updates. Please refresh.';
        return; // Stop processing this malformed message
      }

      console.log('SSE Message:', eventData); // For debugging field names

      if (loadingIndicator.style.display !== 'none') {
          loadingIndicator.style.display = 'none';
      }

      if (eventData.type === 'initialLoad' || eventData.type === 'update') {
        if (eventData.arrivals) {
          updateTable(chegadasTbody, eventData.arrivals, 'arrival');
        }
        if (eventData.departures) {
          updateTable(saidasTbody, eventData.departures, 'departure');
        }
      }
    };

    evtSource.onerror = function(err) {
      console.error("EventSource failed:", err);
      if (loadingIndicator.style.display !== 'none') {
          loadingIndicator.textContent = 'Erro ao conectar ao servidor de atualizações.';
      }
      // Consider adding a visual indicator on the page for connection errors.
    };

    // Ensure the first tab is active on load if no button was clicked yet.
    // The first button already has 'active' class and the first tab has display:block.
    // If you want to be absolutely sure: openTab(null, 'chegadasTab'); but it might cause a flicker.
    // The current HTML/CSS setup should handle the default active tab correctly.

  </script>
</body>
</html>
