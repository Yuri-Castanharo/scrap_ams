    // Função para formatar datas no padrão DD/MM/YYYY - HH:MM:SS
    function formatDateTimeBR(dateStr) {
        if (!dateStr) return '';
        // Tenta lidar com formatos ISO e outros
        let d = new Date(dateStr);
        if (isNaN(d.getTime())) return dateStr; // Se não for data válida, retorna original
        let dia = String(d.getDate()).padStart(2, '0');
        let mes = String(d.getMonth() + 1).padStart(2, '0');
        let ano = d.getFullYear();
        let hora = String(d.getHours()).padStart(2, '0');
        let min = String(d.getMinutes()).padStart(2, '0');
        let seg = String(d.getSeconds()).padStart(2, '0');
        return `${dia}/${mes}/${ano} - ${hora}:${min}:${seg}`;
    }

    // Função para verificar se a data é do dia atual ou anterior
    function isTodayOrYesterday(dateStr) {
        if (!dateStr) return false;
        let d = new Date(dateStr);
        if (isNaN(d.getTime())) return false;
        let now = new Date();
        let today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
        let yesterday = new Date(today);
        yesterday.setDate(today.getDate() - 1);
        let dDay = new Date(d.getFullYear(), d.getMonth(), d.getDate());
        return dDay.getTime() === today.getTime() || dDay.getTime() === yesterday.getTime();
    }

    // --- FILTRO DE JANELA DE 2 HORAS (HOJE) ---
function isWithin2HoursWindow(dateStr) {
  if (!dateStr) return false;
  const d = new Date(dateStr);
  if (isNaN(d.getTime())) return false;
  const now = new Date();
  // Só do mesmo dia
  if (d.getFullYear() !== now.getFullYear() || d.getMonth() !== now.getMonth() || d.getDate() !== now.getDate()) return false;
  const diffMs = d.getTime() - now.getTime();
  const diffH = diffMs / (1000 * 60 * 60);
  return diffH >= -2 && diffH <= 2;
}

// Atualiza função de filtro/sort para usar a janela de 2h
function getFilteredSortedData(type) {
  const data = type === 'arrival' ? fullChegadasData : fullSaidasData;
  const key = type === 'arrival' ? 'arrival.scheduledtime' : 'departure.scheduledtime';
  let filtered = data.filter(item => isWithin2HoursWindow(item[key]));
  // Ordena por horário programado
  filtered = filtered.slice().sort((a, b) => {
    const aTime = a[key] || '';
    const bTime = b[key] || '';
    return aTime.localeCompare(bTime);
  });
  return filtered;
}

    function clearTable(tbody) {
        tbody.innerHTML = '';
    }

    function renderChunk(tbody, data, headerMappings, start, end) {
        // Lista de colunas que são datas/horários
        const dateCols = Object.keys(headerMappings).filter(k => k.match(/time|date|hora|hr|atd|ata|etd|eta|fim|inicio|start|end|onchock|offchock|calco|po|saida|chegada|embarque|solicitacao|request|claim|baggage|bagagem|restituicao|taxi|stand|posicao|posicao|terminal|landed/i));
        for (let i = start; i < end && i < data.length; i++) {
            const item = data[i];
            const flightIdKey = 'flight.flightNumber';
            const scheduledTimeKey = headerMappings['arrival.scheduledTime'] ? 'arrival.scheduledTime' : 'departure.scheduledTime';
            const flightId = item[flightIdKey] || 'N/A_Flight_' + Math.random().toString(36).substring(2, 11);
            const scheduledTime = item[scheduledTimeKey] || String(Date.now() + Math.random());
            const rowId = flightId + '_' + scheduledTime;
            let row = tbody.insertRow();
            row.dataset.id = rowId;
            for (const dataKey in headerMappings) {
                if (headerMappings.hasOwnProperty(dataKey)) {
                    const cell = row.insertCell();
                    let cellValue = item[dataKey];
                    if (dateCols.includes(dataKey)) {
                        cellValue = formatDateTimeBR(cellValue);
                    }
                    cell.textContent = cellValue !== undefined && cellValue !== null ? cellValue : '';
                }
            }
        }
    }

    // --- SUBSTITUI TODAS AS CHAMADAS DE getSortedAndFilteredData POR getFilteredSortedData ---

    // 1. updateTableInfinite
    function updateTableInfinite(tbody, type, headerMappings, reset = false) {
        const filteredSorted = getFilteredSortedData(type);
        let scrollIndex = type === 'arrival' ? chegadasScrollIndex : saidasScrollIndex;
        if (reset) scrollIndex = 0;
        if (reset) clearTable(tbody);
        renderChunk(tbody, filteredSorted, headerMappings, scrollIndex, scrollIndex + chunkSize);
        if (type === 'arrival') chegadasScrollIndex = scrollIndex + chunkSize;
        else saidasScrollIndex = scrollIndex + chunkSize;
    }

    // 2. setupVirtualScroll
    function setupVirtualScroll(containerId, tbody, type, headerMappings) {
        const container = document.getElementById(containerId);
        let lastStart = -1;
        let lastEnd = -1;
        let rafId = null;
        const rowHeight = 38;
        const buffer = 6;
        function renderVirtualRows() {
            const filteredSorted = getFilteredSortedData(type);
            const totalRows = filteredSorted.length;
            const visibleRows = Math.ceil(container.clientHeight / rowHeight);
            const scrollTop = container.scrollTop;
            const start = Math.max(0, Math.floor(scrollTop / rowHeight) - buffer);
            const end = Math.min(totalRows, start + visibleRows + 2 * buffer);
            if (start === lastStart && end === lastEnd) return;
            lastStart = start; lastEnd = end;
            tbody.innerHTML = '';
            if (start > 0) {
                const spacer = document.createElement('tr');
                spacer.style.height = (start * rowHeight) + 'px';
                tbody.appendChild(spacer);
            }
            const dateCols = Object.keys(headerMappings).filter(k => k.match(/time|date|hora|hr|atd|ata|etd|eta|fim|inicio|start|end|onchock|offchock|calco|po|saida|chegada|embarque|solicitacao|request|claim|baggage|bagagem|restituicao|taxi|stand|posicao|posicao|terminal|landed/i));
            for (let i = start; i < end; i++) {
                const item = filteredSorted[i];
                if (!item) continue;
                const row = tbody.insertRow();
                row.className = 'virtual-row';
                for (const dataKey in headerMappings) {
                    if (headerMappings.hasOwnProperty(dataKey)) {
                        const cell = row.insertCell();
                        let cellValue = item[dataKey];
                        if (dateCols.includes(dataKey)) {
                            cellValue = formatDateTimeBR(cellValue);
                        }
                        cell.textContent = cellValue !== undefined && cellValue !== null ? cellValue : '';
                    }
                }
            }
            if (end < totalRows) {
                const spacer = document.createElement('tr');
                spacer.style.height = ((totalRows - end) * rowHeight) + 'px';
                tbody.appendChild(spacer);
            }
        }
        function onScrollOrResize() {
            if (rafId) cancelAnimationFrame(rafId);
            rafId = requestAnimationFrame(renderVirtualRows);
        }
        container.removeEventListener('scroll', onScrollOrResize);
        window.removeEventListener('resize', onScrollOrResize);
        container.addEventListener('scroll', onScrollOrResize);
        window.addEventListener('resize', onScrollOrResize);
        renderVirtualRows();
    }

    // 3. updateTable
    function updateTable(tbody, fullItems, type, headerMappings) {
        let currentPage;
        if (type === 'arrival') {
            fullChegadasData = fullItems === fullChegadasData ? fullChegadasData : fullItems;
            currentPage = chegadasCurrentPage;
        } else {
            fullSaidasData = fullItems === fullSaidasData ? fullSaidasData : fullItems;
            currentPage = saidasCurrentPage;
        }
        const filteredSorted = getFilteredSortedData(type);
        const startIndex = (currentPage - 1) * itemsPerPage;
        const endIndex = startIndex + itemsPerPage;
        const paginatedItems = filteredSorted.slice(startIndex, endIndex);
        tbody.innerHTML = '';
        if (!paginatedItems || !headerMappings) return;
        const dateCols = Object.keys(headerMappings).filter(k => k.match(/time|date|hora|hr|atd|ata|etd|eta|fim|inicio|start|end|onchock|offchock|calco|po|saida|chegada|embarque|solicitacao|request|claim|baggage|bagagem|restituicao|taxi|stand|posicao|posicao|terminal|landed/i));
        paginatedItems.forEach(item => {
            const flightIdKey = 'flight.flightNumber';
            const scheduledTimeKey = (type === 'arrival' ? 'arrival.scheduledTime' : 'departure.scheduledTime');
            const flightId = item[flightIdKey] || 'N/A_Flight_' + Math.random().toString(36).substring(2, 11);
            const scheduledTime = item[scheduledTimeKey] || String(Date.now() + Math.random());
            const rowId = flightId + '_' + scheduledTime;
            let row = tbody.insertRow();
            row.dataset.id = rowId;
            for (const dataKey in headerMappings) {
                if (headerMappings.hasOwnProperty(dataKey)) {
                    const cell = row.insertCell();
                    let cellValue = item[dataKey];
                    if (dateCols.includes(dataKey)) {
                        cellValue = formatDateTimeBR(cellValue);
                    }
                    cell.textContent = cellValue !== undefined && cellValue !== null ? cellValue : '';
                }
            }
        });
      }

    // Remove paginação e use apenas scroll infinito
    // Atualiza SSE para usar scroll infinito
    const evtSource = new EventSource('/api/data-stream');

    evtSource.onmessage = function(event) {
      let eventData;
      try {
        eventData = JSON.parse(event.data);
      } catch (err) {
        console.error('Error parsing SSE data:', err, 'Raw data:', event.data);
        return;
      }
      if (loadingIndicator.style.display !== 'none') {
          loadingIndicator.style.display = 'none';
      }
      if (eventData.type === 'initialLoad' || eventData.type === 'update') {
        if (eventData.arrivals) {
          fullChegadasData = eventData.arrivals;
          chegadasScrollIndex = 0;
          updateTableInfinite(chegadasTbody, 'arrival', cabecalhosChegadas, true);
        }
        if (eventData.departures) {
          fullSaidasData = eventData.departures;
          saidasScrollIndex = 0;
          updateTableInfinite(saidasTbody, 'departure', cabecalhosSaidas, true);
        }
      }
    };

    // Função para mostrar/ocultar spinner
function showSpinner(show) {
  const spinner = document.getElementById('spinnerOverlay');
  if (spinner) spinner.style.display = show ? 'flex' : 'none';
}

// Exemplo de uso: mostrar spinner ao buscar dados
// Mostra spinner antes de atualizar dados
function fetchAndUpdateChegadas(data) {
  showSpinner(true);
  setTimeout(() => { // simula carregamento async
    fullChegadasData = data;
    setupVirtualScroll('chegadasTableContainer', chegadasTbody, 'arrival', cabecalhosChegadas);
    showSpinner(false);
  }, 300); // ajuste conforme necessário
}

function fetchAndUpdateSaidas(data) {
  showSpinner(true);
  setTimeout(() => {
    fullSaidasData = data;
    setupVirtualScroll('saidasTableContainer', saidasTbody, 'departure', cabecalhosSaidas);
    showSpinner(false);
  }, 300);
}

// Altere o onmessage do SSE para usar o spinner
if (typeof evtSource !== 'undefined') {
  evtSource.onmessage = function(event) {
    let eventData;
    try {
      eventData = JSON.parse(event.data);
    } catch (err) {
      console.error('Error parsing SSE data:', err, 'Raw data:', event.data);
      return;
    }
    if (eventData.type === 'initialLoad' || eventData.type === 'update') {
      if (eventData.arrivals) fetchAndUpdateChegadas(eventData.arrivals);
      if (eventData.departures) fetchAndUpdateSaidas(eventData.departures);
    }
  };
}

// Armazena dados exibidos e linhas destacadas
let displayedArrivals = [];
let displayedDepartures = [];

// Função para comparar objetos (shallow)
function isRowDifferent(a, b) {
  if (!a || !b) return true;
  const keys = new Set([...Object.keys(a), ...Object.keys(b)]);
  for (const k of keys) {
    if (a[k] !== b[k]) return true;
  }
  return false;
}

// --- HIGHLIGHTED ROWS LOGIC ---
// Mantém um mapa de rows destacados e seus timeouts
let highlightedRows = { arrival: {}, departure: {} };
let highlightedTimeouts = { arrival: {}, departure: {} };

// Sempre mantém os dados ordenados por horário programado
function sortByScheduledTime(data, type) {
  const key = type === 'arrival' ? 'arrival.scheduledtime' : 'departure.scheduledtime';
  return data.slice().sort((a, b) => {
    const aTime = a[key] || '';
    const bTime = b[key] || '';
    return aTime.localeCompare(bTime);
  });
}

// Retorna o array para exibir: destacados no topo, resto ordenado
function getDisplayData(type) {
  const fullData = type === 'arrival' ? fullChegadasData : fullSaidasData;
  const highlightedMap = highlightedRows[type];
  const keyId = type === 'arrival' ? 'arrival.flightid' : 'departure.flightid';
  const keySched = type === 'arrival' ? 'arrival.scheduledtime' : 'departure.scheduledtime';
  // Ordena tudo por horário
  const sorted = sortByScheduledTime(fullData, type);
  // Se houver rows destacados, coloca no topo
  const highlightedList = [];
  const rest = [];
  for (const row of sorted) {
    const id = row[keyId] + '_' + row[keySched];
    if (highlightedMap[id]) highlightedList.push(row);
    else rest.push(row);
  }
  return [...highlightedList, ...rest];
}

// Atualiza e destaca linhas alteradas, mantendo ordenação
function updateAndHighlight(type, newData, headerMappings, tbody, containerId) {
  const keyId = type === 'arrival' ? 'arrival.flightid' : 'departure.flightid';
  if (type === 'arrival') fullChegadasData = newData.slice();
  else fullSaidasData = newData.slice();
  const prevData = type === 'arrival' ? displayedArrivals : displayedDepartures;
  const changed = [];
  newData.forEach(row => {
    const id = row[keyId];
    const old = prevData.find(r => r[keyId] === id);
    if (old && isRowDifferent(row, old)) changed.push({ row, id });
  });
  // Loga os IDs e suas posições na tabela filtrada
  if (changed.length > 0) {
    const filtered = getFilteredSortedData(type);
    changed.forEach(({ id }) => {
      const idx = filtered.findIndex(r => r[keyId] === id);
      console.log(`[${type}] Atualização: ID do voo ${id} na linha ${idx + 1}`);
    });
  }
  changed.forEach(({ id }) => {
    highlightedRows[type][id] = true;
    if (highlightedTimeouts[type][id]) clearTimeout(highlightedTimeouts[type][id]);
    highlightedTimeouts[type][id] = setTimeout(() => {
      highlightedRows[type][id] = false;
      highlightedTimeouts[type][id] = null;
      renderVirtualRows(type, getFilteredSortedData(type), headerMappings, tbody, containerId, highlightedRows[type]);
    }, 10000);
  });
  if (type === 'arrival') displayedArrivals = newData.slice();
  else displayedDepartures = newData.slice();
  renderVirtualRows(type, getFilteredSortedData(type), headerMappings, tbody, containerId, highlightedRows[type]);
}

// --- CORRIGE FILTRO DE 1 HORA E VIRTUAL SCROLL ---
function isWithin1HourWindow(dateStr) {
  if (!dateStr) return false;
  const d = new Date(dateStr);
  if (isNaN(d.getTime())) return false;
  const now = new Date();
  if (d.getFullYear() !== now.getFullYear() || d.getMonth() !== now.getMonth() || d.getDate() !== now.getDate()) return false;
  const diffH = (d.getTime() - now.getTime()) / (1000 * 60 * 60);
  return diffH >= -1 && diffH <= 1;
}

function getFilteredSortedData(type) {
  const data = type === 'arrival' ? fullChegadasData : fullSaidasData;
  const key = type === 'arrival' ? 'arrival.scheduledtime' : 'departure.scheduledtime';
  let filtered = data.filter(item => isWithin1HourWindow(item[key]));
  filtered = filtered.slice().sort((a, b) => {
    const aTime = a[key] || '';
    const bTime = b[key] || '';
    return aTime.localeCompare(bTime);
  });
  return filtered;
}

// --- VIRTUAL SCROLL COM CABEÇALHO FIXO E PISCAGEM ---
function renderVirtualRows(type, data, headerMappings, tbody, containerId, highlighted) {
  const container = document.getElementById(containerId);
  const rowHeight = 38;
  const buffer = 8;
  const totalRows = data.length;
  const visibleRows = Math.ceil(container.clientHeight / rowHeight);
  const scrollTop = container.scrollTop;
  const start = Math.max(0, Math.floor(scrollTop / rowHeight) - buffer);
  const end = Math.min(totalRows, start + visibleRows + 2 * buffer);
  tbody.innerHTML = '';
  if (start > 0) {
    const spacer = document.createElement('tr');
    spacer.style.height = (start * rowHeight) + 'px';
    tbody.appendChild(spacer);
  }
  const dateCols = Object.keys(headerMappings).filter(k => k.match(/time|date|hora|hr|atd|ata|etd|eta|fim|inicio|start|end|onchock|offchock|calco|po|saida|chegada|embarque|solicitacao|request|claim|baggage|bagagem|restituicao|taxi|stand|posicao|posicao|terminal|landed/i));
  const idVooKey = Object.keys(headerMappings)[0];
  for (let i = start; i < end; i++) {
    const item = data[i];
    if (!item) continue;
    const row = tbody.insertRow();
    row.className = 'virtual-row';
    const keyId = type === 'arrival' ? 'arrival.flightid' : 'departure.flightid';
    const id = item[keyId];
    if (highlighted && highlighted[id]) row.classList.add('tr-blink');
    let colIdx = 0;
    for (const dataKey in headerMappings) {
      if (headerMappings.hasOwnProperty(dataKey)) {
        const cell = row.insertCell();
        let cellValue = item[dataKey];
        if (dateCols.includes(dataKey)) {
          cellValue = formatDateTimeBR(cellValue);
        }
        // Se for a coluna do ID do voo, adiciona a bolinha se destacado
        if (colIdx === 0) {
          cell.innerHTML = cellValue !== undefined && cellValue !== null ? cellValue : '';
          if (highlighted && highlighted[id]) {
            const dot = document.createElement('span');
            dot.className = 'blink-dot';
            cell.appendChild(dot);
          }
        } else {
          cell.textContent = cellValue !== undefined && cellValue !== null ? cellValue : '';
        }
        colIdx++;
      }
    }
  }
  if (end < totalRows) {
    const spacer = document.createElement('tr');
    spacer.style.height = ((totalRows - end) * rowHeight) + 'px';
    tbody.appendChild(spacer);
  }
}
